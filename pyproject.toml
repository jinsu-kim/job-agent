[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-job-fit-agent"
version = "0.1.0"
description = "Evidence-constrained job posting and resume fit evaluator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jobfit = "jobfit.cli:main"

[tool.setuptools.packages.find]
include = ["jobfit*"]
